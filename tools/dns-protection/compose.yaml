# Deliberately no automatic production startup until commissioning is approved.
# Host network preserves original DNS client IP; only profile-selected IP/ports bind.
services:
  resolver:
    image: ${ADGUARD_IMAGE:?Use the reviewed pinned image from the private profile}
    user: "${PROFILE_UID:?Set the private profile owner}:${PROFILE_GID:?Set the private profile group}"
    network_mode: host
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${PROFILE_DIR:?Select the private profile}/conf:/opt/adguardhome/conf
      - ${PROFILE_DIR:?Select the private profile}/work:/opt/adguardhome/work
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}

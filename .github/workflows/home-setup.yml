name: Home setup bundles
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    name: Home setup / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Host and transaction checks (no TV)
        run: |
          python -m pip install pytest==8.4.2 pyinstaller==6.16.0
          python -m pytest -q tests/test_home_setup.py tests/test_setup_bundle.py tests/test_setup_diagnostics.py
          dotnet run --project tools/home-control/PolicyTests.csproj -c Release -p:UseSharedCompilation=false
          python scripts/build-home-setup.py
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name CleanHome-Home-Setup-Windows-experimental --paths "$PWD" --paths "$PWD/tools/home-setup" --add-data "$PWD/tools/home-setup/index.html:." --add-data "$PWD/dist/home-setup/tools/home-setup/payload:payload" --distpath dist/companion --workpath .local/pyinstaller --specpath .local/pyinstaller tools/home-setup/setup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./dist/companion/CleanHome-Home-Setup-Windows-experimental.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./dist/companion/CleanHome-Home-Setup-Windows-experimental.exe --check-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-windows-setup.py dist/companion/CleanHome-Home-Setup-Windows-experimental.exe
      - name: Package app and Home setup together
        run: python scripts/prepare-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-setup-${{ runner.os }}
          path: |
            dist/CleanHome-Home-Setup-experimental.zip
            dist/companion/*.zip
            dist/release/CleanHome-Setup-*.zip
          if-no-files-found: error
          retention-days: 7

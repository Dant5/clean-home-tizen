<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc">
<title id="title">Clean Home TV compatibility</title>
<desc id="desc">Tizen 5.0 to 10.0 are preview targets with passing browser checks. Only the Q60B on Tizen 6.5 has real-TV reference evidence, running Clean Home 1.3.9. Other models await confirmation. Tizen 4.0 and earlier are outside the target.</desc>
<rect width="1120" height="920" rx="20" fill="#101a28"/>
<g font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#f4f7fb">
<text x="36" y="57" font-size="34" fill="#f4f7fb" font-weight="700">Will Clean Home work on my TV?</text>
<text x="36" y="94" font-size="21" fill="#b9c9dc" font-weight="400">Made for Tizen 5.0–10.0. Most TV models still need testing.</text>
<text x="36" y="151" font-size="19" fill="#b9c9dc" font-weight="600">Tizen OS</text>
<text x="194" y="151" font-size="19" fill="#b9c9dc" font-weight="600">Typical year*</text>
<text x="360" y="151" font-size="19" fill="#b9c9dc" font-weight="600">App target</text>
<text x="571" y="151" font-size="19" fill="#b9c9dc" font-weight="600">Browser check</text>
<text x="814" y="151" font-size="19" fill="#b9c9dc" font-weight="600">Actual TV</text>
<rect x="22" y="174" width="1076" height="64" rx="6" fill="#19283a"/>
<text x="36" y="214" font-size="25" fill="#f4f7fb" font-weight="600">5.0</text>
<text x="194" y="214" font-size="21" fill="#f4f7fb" font-weight="400">2019</text>
<text x="360" y="214" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="214" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="214" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<text x="36" y="280" font-size="25" fill="#f4f7fb" font-weight="600">5.5</text>
<text x="194" y="280" font-size="21" fill="#f4f7fb" font-weight="400">2020</text>
<text x="360" y="280" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="280" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="280" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<rect x="22" y="306" width="1076" height="64" rx="6" fill="#19283a"/>
<text x="36" y="346" font-size="25" fill="#f4f7fb" font-weight="600">6.0</text>
<text x="194" y="346" font-size="21" fill="#f4f7fb" font-weight="400">2021</text>
<text x="360" y="346" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="346" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="346" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<text x="36" y="412" font-size="25" fill="#f4f7fb" font-weight="600">6.5</text>
<text x="194" y="412" font-size="21" fill="#f4f7fb" font-weight="400">2022</text>
<text x="360" y="412" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="412" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="412" font-size="20" fill="#88e0b4" font-weight="400">Tested: Q60B**</text>
<rect x="22" y="438" width="1076" height="64" rx="6" fill="#19283a"/>
<text x="36" y="478" font-size="25" fill="#f4f7fb" font-weight="600">7.0</text>
<text x="194" y="478" font-size="21" fill="#f4f7fb" font-weight="400">2023</text>
<text x="360" y="478" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="478" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="478" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<text x="36" y="544" font-size="25" fill="#f4f7fb" font-weight="600">8.0</text>
<text x="194" y="544" font-size="21" fill="#f4f7fb" font-weight="400">2024</text>
<text x="360" y="544" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="544" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="544" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<rect x="22" y="570" width="1076" height="64" rx="6" fill="#19283a"/>
<text x="36" y="610" font-size="25" fill="#f4f7fb" font-weight="600">9.0</text>
<text x="194" y="610" font-size="21" fill="#f4f7fb" font-weight="400">2025</text>
<text x="360" y="610" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="610" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="610" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<text x="36" y="676" font-size="25" fill="#f4f7fb" font-weight="600">10.0</text>
<text x="194" y="676" font-size="21" fill="#f4f7fb" font-weight="400">2026</text>
<text x="360" y="676" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="676" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="676" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<text x="36" y="742" font-size="22" fill="#f4f7fb" font-weight="400">4.0 or older</text>
<text x="194" y="742" font-size="19" fill="#f4f7fb" font-weight="400">2018 or older</text>
<text x="360" y="742" font-size="20" fill="#b9c9dc" font-weight="400">Outside target</text>
<text x="571" y="742" font-size="20" fill="#b9c9dc" font-weight="400">Not covered</text>
<text x="814" y="742" font-size="20" fill="#b9c9dc" font-weight="400">Unconfirmed</text>
<text x="36" y="809" font-size="18" fill="#b9c9dc" font-weight="400">* Model-year guide. Your TV may have received a newer OS.</text>
<text x="36" y="840" font-size="18" fill="#b9c9dc" font-weight="400">** Reference TV runs 1.3.9; the 1.4.2 preview is browser-tested.</text>
<text x="36" y="871" font-size="18" fill="#b9c9dc" font-weight="400">Passing browser checks does not guarantee that every TV will work.</text>
</g></svg>

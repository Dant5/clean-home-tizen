<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Clean Home TV compatibility</title>
<desc id="desc">Tizen 5.0 to 10.0 are preview targets with passing browser checks. Only the Q60B on Tizen 6.5 has real-TV reference evidence, running Clean Home 1.3.9. Other models await confirmation. Tizen 4.0 and earlier are outside the target.</desc>
<rect width="1120" height="700" rx="20" fill="#101a28"/>
<g font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#f4f7fb">
<text x="36" y="50" font-size="34" fill="#f4f7fb" font-weight="700">Will Clean Home work on my TV?</text>
<text x="36" y="84" font-size="21" fill="#b9c9dc" font-weight="400">Made for Tizen 5.0–10.0. Most TV models still need testing.</text>
<text x="36" y="130" font-size="19" fill="#b9c9dc" font-weight="600">Tizen OS</text>
<text x="194" y="130" font-size="19" fill="#b9c9dc" font-weight="600">Typical year*</text>
<text x="360" y="130" font-size="19" fill="#b9c9dc" font-weight="600">App target</text>
<text x="571" y="130" font-size="19" fill="#b9c9dc" font-weight="600">Browser check</text>
<text x="814" y="130" font-size="19" fill="#b9c9dc" font-weight="600">Actual TV</text>
<rect x="22" y="147" width="1076" height="46" rx="6" fill="#19283a"/>
<text x="36" y="178" font-size="23" fill="#f4f7fb" font-weight="600">5.0</text>
<text x="194" y="178" font-size="21" fill="#f4f7fb" font-weight="400">2019</text>
<text x="360" y="178" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="178" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="178" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<text x="36" y="226" font-size="23" fill="#f4f7fb" font-weight="600">5.5</text>
<text x="194" y="226" font-size="21" fill="#f4f7fb" font-weight="400">2020</text>
<text x="360" y="226" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="226" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="226" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<rect x="22" y="243" width="1076" height="46" rx="6" fill="#19283a"/>
<text x="36" y="274" font-size="23" fill="#f4f7fb" font-weight="600">6.0</text>
<text x="194" y="274" font-size="21" fill="#f4f7fb" font-weight="400">2021</text>
<text x="360" y="274" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="274" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="274" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<text x="36" y="322" font-size="23" fill="#f4f7fb" font-weight="600">6.5</text>
<text x="194" y="322" font-size="21" fill="#f4f7fb" font-weight="400">2022</text>
<text x="360" y="322" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="322" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="322" font-size="20" fill="#88e0b4" font-weight="400">Tested: Q60B**</text>
<rect x="22" y="339" width="1076" height="46" rx="6" fill="#19283a"/>
<text x="36" y="370" font-size="23" fill="#f4f7fb" font-weight="600">7.0</text>
<text x="194" y="370" font-size="21" fill="#f4f7fb" font-weight="400">2023</text>
<text x="360" y="370" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="370" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="370" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<text x="36" y="418" font-size="23" fill="#f4f7fb" font-weight="600">8.0</text>
<text x="194" y="418" font-size="21" fill="#f4f7fb" font-weight="400">2024</text>
<text x="360" y="418" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="418" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="418" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<rect x="22" y="435" width="1076" height="46" rx="6" fill="#19283a"/>
<text x="36" y="466" font-size="23" fill="#f4f7fb" font-weight="600">9.0</text>
<text x="194" y="466" font-size="21" fill="#f4f7fb" font-weight="400">2025</text>
<text x="360" y="466" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="466" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="466" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<text x="36" y="514" font-size="23" fill="#f4f7fb" font-weight="600">10.0</text>
<text x="194" y="514" font-size="21" fill="#f4f7fb" font-weight="400">2026</text>
<text x="360" y="514" font-size="20" fill="#b5d2ff" font-weight="400">Preview target</text>
<text x="571" y="514" font-size="20" fill="#88e0b4" font-weight="400">Passed</text>
<text x="814" y="514" font-size="20" fill="#f0ca85" font-weight="400">Unconfirmed</text>
<text x="36" y="562" font-size="22" fill="#f4f7fb" font-weight="400">4.0 or older</text>
<text x="194" y="562" font-size="19" fill="#f4f7fb" font-weight="400">2018 or older</text>
<text x="360" y="562" font-size="20" fill="#b9c9dc" font-weight="400">Outside target</text>
<text x="571" y="562" font-size="20" fill="#b9c9dc" font-weight="400">Not covered</text>
<text x="814" y="562" font-size="20" fill="#b9c9dc" font-weight="400">Unconfirmed</text>
<text x="36" y="608" font-size="18" fill="#b9c9dc" font-weight="400">* Model-year guide. Your TV may have received a newer OS.</text>
<text x="36" y="636" font-size="18" fill="#b9c9dc" font-weight="400">** Reference TV runs 1.3.9; the 1.4.2 preview is browser-tested.</text>
<text x="36" y="664" font-size="18" fill="#b9c9dc" font-weight="400">Passing browser checks does not guarantee that every TV will work.</text>
</g></svg>
